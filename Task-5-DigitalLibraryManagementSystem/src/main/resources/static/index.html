<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Library</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><form id="loginForm">
    <h1>📚 Digital Library</h1><p>Sign in to your library</p>
    <input id="username" placeholder="Username" required>
    <input id="password" type="password" placeholder="Password" required>
    <button>Sign in</button></form></div>
<div id="app" class="hidden"><aside><h2>📚 Library</h2><nav><button data-page="dashboard">Dashboard</button><button data-page="books">Books</button><button data-page="members">Members</button><button data-page="loans">Issue / Return</button><button data-page="bookings">Bookings</button><button data-page="contact">Contact</button></nav><button id="logout">Log out</button></aside><main><header><h1 id="heading">Dashboard</h1><span id="who"></span></header>
<section id="dashboard" class="page"><div class="hero"><h2>Welcome to your library</h2><p>Discover books and manage library activities.</p></div><div class="stats"><div>Books <b id="bc">0</b></div><div>Members <b id="mc">0</b></div><div>Active loans <b id="lc">0</b></div><div>Bookings <b id="kc">0</b></div></div></section>
<section id="books" class="page hidden"><input id="search" placeholder="Search books by title or author"><button id="addToggle" class="admin">+ Add book</button><form id="bookForm" class="panel hidden"><h3 id="formTitle">Add book</h3><input id="title" placeholder="Title" required><input id="author" placeholder="Author" required><input id="isbn" placeholder="ISBN"><input id="category" placeholder="Category"><button>Save</button><button type="button" id="cancel">Cancel</button></form><div id="bookList" class="grid"></div></section>
<section id="members" class="page hidden"><form id="memberForm" class="panel admin"><h3>Register member</h3><input id="mname" placeholder="Name" required><input id="memail" type="email" placeholder="Email" required><input id="mphone" placeholder="Phone"><button>Save member</button></form><div id="memberList" class="grid"></div></section>
<section id="loans" class="page hidden"><div id="loanList" class="panel"></div></section><section id="bookings" class="page hidden"><div id="bookingList" class="panel"></div></section>
<section id="contact" class="page hidden"><form id="contactForm" class="panel"><h3>Contact us</h3>
    <input id="cname" placeholder="Name" required><input id="cemail" type="email" placeholder="Email" required>
    <textarea id="msg" placeholder="Message" required></textarea><button>Send message</button>
    <p id="sent"></p></form><div id="inbox" class="panel admin"></div></section></main>
</div><script src="script.js"></script></body></html>
